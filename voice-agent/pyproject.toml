[project]
name = "voice-agent"
version = "0.1.0"
description = "Asterisk AudioSocket × ローカル STT/LLM/TTS の完全オフライン音声エージェント"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # Apple Silicon の Mac だけ。他の環境では STT_BACKEND=faster を使う
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=1.26",
]

[project.optional-dependencies]
faster = [
    "faster-whisper>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent"]
