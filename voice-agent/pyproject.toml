[project]
name = "voice-agent"
version = "0.1.0"
description = "Asterisk AudioSocket × ローカル STT/LLM/TTS の完全オフライン音声エージェント"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mlx-whisper>=0.4.3",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent"]
