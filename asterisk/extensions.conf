[from-internal]
; 600: エコーテスト
exten => 600,1,NoOp(Echo Test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; 100: Voice Agent（ホストの Python に AudioSocket で音声を渡す）
; AudioSocket(UUID, 接続先) … UUID は通話の識別子。いまは固定値
exten => 100,1,NoOp(Voice Agent)
 same => n,Answer()
 same => n,AudioSocket(9a2d4f3e-6b1c-4e8a-9f00-000000000100,host.docker.internal:9090)
 same => n,Hangup()

; 内線同士の通話 (6001 <-> 6002)
exten => _60XX,1,NoOp(Internal Call)
  same => n , Dial(PJSIP/${EXTEN},30)
  same => n , NoOp(Dial Status: ${DIALSTATUS})
  same => n , Hangup()

; h: どの内線でも、通話が切れたときに Asterisk が自動で飛んでくる
exten => h,1,NoOp(Hangup)
 same => n,NoOp(Dial Status: ${DIALSTATUS})
 same => n,NoOp(Hangup Cause: ${HANGUPCAUSE})
 same => n,Hangup()
